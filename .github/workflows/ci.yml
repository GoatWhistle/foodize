name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: foodize_test
          POSTGRES_USER: foodize_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d foodize_test -U foodize_user"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: foodize_test
      POSTGRES_USER: foodize_user
      POSTGRES_PASSWORD: test_password
      DB__URL: postgresql+asyncpg://foodize_user:test_password@localhost:5432/foodize_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate JWT keys
        run: |
          mkdir -p certs
          openssl genrsa -out certs/jwt-private.pem 2048
          openssl rsa -in certs/jwt-private.pem -outform PEM -pubout -out certs/jwt-public.pem

      - name: Run Mypy
        run: uv run mypy .

      - name: Run Tests
        run: uv run pytest --cov=. --cov-report=xml

      - name: Run DB tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://foodize_user:test_password@localhost:5432/foodize_test
        run: uv run pytest tests/db -q

      - name: Run Alembic check
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run pip-audit (dependency vulnerability scan)
        run: uvx pip-audit --strict -r <(uv export --frozen --no-hashes --no-emit-project)

  pre-commit-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        working-directory: src/backend
        run: uv python install 3.13

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/shared/package-lock.json
            src/frontend/package-lock.json
            src/telegram-miniapp/package-lock.json
            src/mobile/package-lock.json

      - name: Install shared dependencies
        working-directory: src/shared
        run: npm ci

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install miniapp dependencies
        working-directory: src/telegram-miniapp
        run: npm ci

      - name: Install mobile dependencies
        working-directory: src/mobile
        run: npm ci

      - name: Generate JWT keys
        working-directory: src/backend
        run: |
          mkdir -p certs
          openssl genrsa -out certs/jwt-private.pem 2048
          openssl rsa -in certs/jwt-private.pem -outform PEM -pubout -out certs/jwt-public.pem

      - name: Run all pre-commit hooks
        working-directory: src/backend
        run: uv run pre-commit run --all-files --show-diff-on-failure

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage -- --run

      - name: Run npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=high

  telegram-bot-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/telegram-bot
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run pytest

      - name: Run pip-audit (dependency vulnerability scan)
        run: uvx pip-audit --strict -r <(uv export --frozen --no-hashes --no-emit-project)

  telegram-miniapp-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/telegram-miniapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/telegram-miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage -- --run

      - name: Run npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=high

  shared-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/shared
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage -- --run

      - name: Run npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=high

  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/shared/package-lock.json
            src/mobile/package-lock.json

      - name: Install shared dependencies
        working-directory: src/shared
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests with Coverage
        run: npm run test:coverage


  openapi-contract-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        working-directory: src/backend
        run: uv python install 3.13

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/telegram-miniapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install miniapp dependencies
        working-directory: src/telegram-miniapp
        run: npm ci

      - name: Generate JWT keys
        working-directory: src/backend
        run: |
          mkdir -p certs
          openssl genrsa -out certs/jwt-private.pem 2048
          openssl rsa -in certs/jwt-private.pem -outform PEM -pubout -out certs/jwt-public.pem

      - name: Regenerate OpenAPI contract
        run: make openapi

      - name: Ensure generated contract is committed
        run: git diff --exit-code -- openapi/foodize.openapi.json src/frontend/src/services/generated src/telegram-miniapp/src/services/generated

  compose-consistency-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide .env for compose parsing
        run: cp .env.example .env

      - name: Check docker-compose.yaml vs docker-compose.prod.yaml consistency
        run: python3 tools/check_compose_consistency.py

  backup-restore-ci:
    runs-on: ubuntu-latest
    env:
      PG_CONTAINER: foodize_pg
      POSTGRES_DB: foodize
      POSTGRES_USER: foodize_user
      POSTGRES_PASSWORD: test_password
      BACKUP_DIR: ./backups
      BACKUP_ENCRYPTION_PASSPHRASE: ci-test-passphrase
    steps:
      - uses: actions/checkout@v4

      - name: Start ephemeral Postgres (named to match backup/restore scripts)
        run: |
          docker run -d --name "$PG_CONTAINER" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            pgvector/pgvector:pg17
          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Seed known data
        run: |
          docker exec -i "$PG_CONTAINER" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
          CREATE TABLE restore_probe (id int PRIMARY KEY, note text);
          INSERT INTO restore_probe VALUES (1, 'foodize-backup-restore-canary');
          SQL

      - name: Take an encrypted backup (tools/backup.sh)
        run: bash tools/backup.sh

      - name: Corrupt live data to prove restore actually rewrites it
        run: |
          docker exec -i "$PG_CONTAINER" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "DELETE FROM restore_probe;"

      - name: Restore from the encrypted backup (tools/restore.sh)
        run: |
          DUMP=$(ls -t ./backups/foodize_*.dump.enc | head -n1)
          echo "Restoring from $DUMP"
          bash tools/restore.sh "$DUMP" --yes

      - name: Verify restored data matches the canary
        run: |
          RESULT=$(docker exec -i "$PG_CONTAINER" psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT note FROM restore_probe WHERE id = 1;")
          echo "Restored value: '$RESULT'"
          test "$RESULT" = "foodize-backup-restore-canary"

      - name: Tear down
        if: always()
        run: docker rm -f "$PG_CONTAINER" || true

  docker-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hadolint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/backend/Dockerfile

      - name: Hadolint frontend Dockerfile.prod
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/frontend/Dockerfile.prod

      - name: Hadolint miniapp Dockerfile.prod
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/telegram-miniapp/Dockerfile.prod

      - name: Hadolint telegram-bot Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/telegram-bot/Dockerfile

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: backend
          load: true
          push: false
          tags: foodize-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/frontend/Dockerfile.prod
          target: production
          load: true
          push: false
          tags: foodize-frontend:ci

      - name: Build miniapp image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/telegram-miniapp/Dockerfile.prod
          target: production
          load: true
          push: false
          tags: foodize-miniapp:ci

      - name: Build telegram-bot image
        uses: docker/build-push-action@v6
        with:
          context: src/telegram-bot
          file: src/telegram-bot/Dockerfile
          target: production
          load: true
          push: false
          tags: foodize-telegram-bot:ci

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodize-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodize-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Trivy scan miniapp image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodize-miniapp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Trivy scan telegram-bot image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: foodize-telegram-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
