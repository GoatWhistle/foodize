name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foodize_test
          POSTGRES_USER: foodize_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d foodize_test -U foodize_user"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: foodize_test
      POSTGRES_USER: foodize_user
      POSTGRES_PASSWORD: test_password
      DB__URL: postgresql+asyncpg://foodize_user:test_password@localhost:5432/foodize_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Mypy
        run: uv run mypy .

      - name: Run Tests
        run: uv run pytest --cov=. --cov-report=xml

      - name: Run Alembic check
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run pip-audit (dependency vulnerability scan)
        continue-on-error: true
        run: uvx pip-audit --strict -r <(uv export --frozen --no-hashes --no-emit-project)

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --run

      - name: Run Tests with Coverage
        run: npm run test:coverage -- --run

      - name: Run npm audit (dependency vulnerability scan)
        continue-on-error: true
        run: npm audit --audit-level=high

  telegram-miniapp-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/telegram-miniapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/telegram-miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run npm audit (dependency vulnerability scan)
        continue-on-error: true
        run: npm audit --audit-level=high

  openapi-contract-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        working-directory: src/backend
        run: uv python install 3.13

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/telegram-miniapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install miniapp dependencies
        working-directory: src/telegram-miniapp
        run: npm ci

      - name: Regenerate OpenAPI contract
        run: make openapi

      - name: Ensure generated contract is committed
        run: git diff --exit-code -- openapi/foodize.openapi.json src/frontend/src/services/generated src/telegram-miniapp/src/services/generated

  compose-consistency-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose.yaml vs docker-compose.prod.yaml consistency
        run: python3 tools/check_compose_consistency.py
