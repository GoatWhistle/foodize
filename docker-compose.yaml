services:
  pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - foodize-network

  migrations:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    volumes:
      - ./src/backend:/backend
    env_file:
      - .env
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_URL: ${DB__URL}
    command: >
      sh -c "uv run alembic upgrade head"
    restart: "no"
    networks:
      - foodize-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DB_URL: ${DB__URL}
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/backend
    command: >
      uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - foodize-network

  frontend:
    build:
      dockerfile: Dockerfile
      context: ./src/frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./src/frontend:/frontend
    networks:
      - foodize-network

volumes:
  pgdata:

networks:
  foodize-network: