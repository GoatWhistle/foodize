services:
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  migrations:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: migrations
    volumes:
      - ./src/backend/alembic:/backend/alembic
    env_file:
      - .env
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_URL: ${DB__URL}
    restart: "no"
    networks:
      - foodize-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: backend
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: ${DB__URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ__URL: ${RABBITMQ__URL:-amqp://foodize:foodize@rabbitmq:5672/foodize}
      TELEGRAM__BOT_API_SECRET: ${TELEGRAM__BOT_API_SECRET:-}
      WATCHFILES_FORCE_POLLING: "true"
      CORS__ALLOWED_ORIGINS: ${CORS__ALLOWED_ORIGINS:-}
      REDIS__PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/backend
      - ./tools:/tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ__URL: ${RABBITMQ__URL:-amqp://foodize:foodize@rabbitmq:5672/foodize}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./src/backend:/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -rl 'worker.main' /proc/*/cmdline 2>/dev/null | head -1 | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src/frontend:/frontend
      - ./src/shared:/shared
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=/api/v1
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  telegram-bot:
    build:
      context: ./src/telegram-bot
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MINI_APP_URL: ${MINI_APP_URL:-}
      TELEGRAM_BOT_API_SECRET: ${TELEGRAM__BOT_API_SECRET:-}
      REDIS__URL: ${REDIS__URL:-redis://redis:6379/0}
      RABBITMQ__URL: ${RABBITMQ__URL:-amqp://foodize:foodize@rabbitmq:5672/foodize}
      BOT_MODE: ${BOT_MODE:-polling}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -rl 'main.py' /proc/*/cmdline 2>/dev/null | head -1 | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  telegram-miniapp:
    build:
      context: ./src/telegram-miniapp
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./src/telegram-miniapp:/miniapp
      - ./src/shared:/shared
      - /miniapp/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api/v1
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:

networks:
  foodize-network:
