services:
  pg:
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:-pg17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  rabbitmq:
    image: rabbitmq:${RABBITMQ_IMAGE_TAG:-4-management-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      # rabbitmq-diagnostics boots an Erlang CLI node and can take >5s on slow
      # hosts (e.g. WSL2), so give it a generous timeout and a startup grace period.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (also the browser-facing photo URLs)
      - "127.0.0.1:9001:9001"   # MinIO web console
    volumes:
      - miniodata:/data
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # One-shot: create the media bucket and make its objects publicly readable.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required} ${S3_SECRET_KEY:?S3_SECRET_KEY is required}; do echo 'waiting for minio...'; sleep 2; done &&
      mc mb local/${S3_BUCKET:-foodize-media} || true &&
      mc anonymous set download local/${S3_BUCKET:-foodize-media} &&
      echo 'minio bucket ready'
      "
    restart: "no"
    networks:
      - foodize-network

  migrations:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: migrations
    volumes:
      - ./src/backend/alembic:/backend/alembic
    env_file:
      - .env
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_URL: ${DB__URL}
    restart: "no"
    networks:
      - foodize-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: backend-dev
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: ${DB__URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ__URL: ${RABBITMQ__URL:?RABBITMQ__URL is required}
      TELEGRAM__BOT_API_SECRET: ${TELEGRAM__BOT_API_SECRET:-}
      WATCHFILES_FORCE_POLLING: "true"
      CORS__ALLOWED_ORIGINS: ${CORS__ALLOWED_ORIGINS:-}
      REDIS__PASSWORD: ${REDIS_PASSWORD:-}
      S3__ENDPOINT_URL: ${S3__ENDPOINT_URL:-http://minio:9000}
      S3__PUBLIC_BASE_URL: ${S3__PUBLIC_BASE_URL:-http://localhost:9000/foodize-media}
      S3__BUCKET: ${S3_BUCKET:-foodize-media}
      S3__ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3__SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/backend
      - ./tools:/tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: worker-dev
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ__URL: ${RABBITMQ__URL:?RABBITMQ__URL is required}
      WATCHFILES_FORCE_POLLING: "true"
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9200}
    volumes:
      - ./src/backend:/backend
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,os,sys; body=urllib.request.urlopen('http://localhost:'+os.environ.get('WORKER_METRICS_PORT','9200')+'/metrics',timeout=3).read().decode(); sys.exit(0 if 'worker_broker_connected 1.0' in body else 1)\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src/frontend:/frontend
      - ./src/shared:/shared
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=/api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  telegram-bot:
    build:
      context: ./src/telegram-bot
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MINI_APP_URL: ${MINI_APP_URL:-}
      TELEGRAM_BOT_API_SECRET: ${TELEGRAM__BOT_API_SECRET:-}
      REDIS__URL: ${REDIS__URL:-redis://redis:6379/0}
      RABBITMQ__URL: ${RABBITMQ__URL:?RABBITMQ__URL is required}
      BOT_MODE: ${BOT_MODE:-polling}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  telegram-miniapp:
    build:
      context: ./src/telegram-miniapp
      dockerfile: Dockerfile
      target: dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./src/telegram-miniapp:/miniapp
      - ./src/shared:/shared
      - /miniapp/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=/api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5174/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - foodize-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  miniodata:

networks:
  foodize-network:
