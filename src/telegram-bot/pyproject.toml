[project]
name = "foodize-bot"
version = "1.0.0"
description = "Foodize Telegram Bot"
authors = [
    { name = "Mikhail Khorokhorin", email = "mikhailkhorokhorin@gmail.com" },
    { name = "Ivan Gerasimov", email = "ivan.gerasimou@yandex.ru" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15.0,<4.0.0",
    "aio-pika>=9.5.5,<10.0.0",
    "redis>=7.4.0,<8.0.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.10.0",
    "aiohttp-socks>=0.9.0",
    "python-dotenv>=1.2.1,<2.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RET",
    "PIE",
    "PTH",
    "RUF",
    "N",
    "ASYNC",
    "TCH",
    "ARG",
    "DTZ",
    "T20",
]
ignore = [
    "N818",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "DTZ", "N802", "N803", "N806", "SIM117", "B017"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_generics = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["config"]
disallow_any_explicit = false

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.4,<0.15.0",
    "black>=26.3.1,<27.0.0",
    "mypy>=1.18.2,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=. --cov-report=term-missing"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "*/__pycache__/*", "main.py"]

[tool.coverage.report]
fail_under = 85

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
