[project]
name = "foodize-bot"
version = "0.1.0"
description = "Foodize Telegram Bot"
authors = [
    { name = "Mikhail Khorokhorin", email = "mikhailkhorokhorin@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15.0,<4.0.0",
    "aio-pika>=9.5.5,<10.0.0",
    "redis>=7.4.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.10.0",
    "python-dotenv>=1.2.1,<2.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
