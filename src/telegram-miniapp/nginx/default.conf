log_format main_no_qs '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

server {
    listen 8080;
    server_name localhost;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # No X-Frame-Options here: the mini app is loaded inside Telegram's iframe.
    # Framing is restricted via CSP frame-ancestors to Telegram origins only.
    # script-src allows https://telegram.org for telegram-web-app.js (loaded in index.html).
    # img-src allows https: + data: for dish photos from the external S3/CDN.
    # style-src permits 'unsafe-inline' because Vite inlines critical CSS as <style>.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # HSTS is normally terminated at the host nginx (TLS endpoint). Kept here with a
    # short max-age as defense in depth; raise/relocate to host nginx if it sets HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads go through /api/v1/ (5 MB images + multipart overhead).
    client_max_body_size 15m;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, nginx
    # re-resolves `backend` at request time instead of caching its IP at startup,
    # so the API keeps working after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vite emits content-hashed filenames under /assets/, safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise clients keep loading stale asset
    # references after a deploy (the hashed bundles it points to no longer exist).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        access_log /var/log/nginx/access.log main_no_qs;
    }

    location /api/v1/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
